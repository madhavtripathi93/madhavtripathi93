name: 🚀 Update GitHub Projects

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Profile Projects
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Generate Repository Showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: madhavtripathi93
          PROFILE_REPO: madhavtripathi93
        run: |
          python << 'PYTHON'
          import os
          import re
          import json
          import urllib.request
          from urllib.parse import quote

          username = os.environ["USERNAME"]
          profile_repo = os.environ["PROFILE_REPO"]
          token = os.environ["GITHUB_TOKEN"]

          repos = []
          page = 1

          while True:

              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?visibility=public"
                  f"&sort=updated"
                  f"&direction=desc"
                  f"&per_page=100"
                  f"&page={page}"
              )

              request = urllib.request.Request(url)

              request.add_header(
                  "Accept",
                  "application/vnd.github+json"
              )

              request.add_header(
                  "Authorization",
                  f"Bearer {token}"
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1


          # Remove profile repository, forks, and archived repositories
          repos = [

              repo for repo in repos

              if repo["name"].lower() != profile_repo.lower()

              and not repo["fork"]

              and not repo["archived"]

          ]


          # Language → color mapping
          language_colors = {

              "Python": "3776AB",
              "C++": "00599C",
              "C": "A8B9CC",
              "JavaScript": "F7DF1E",
              "TypeScript": "3178C6",
              "Java": "ED8B00",
              "HTML": "E34F26",
              "CSS": "1572B6",
              "Shell": "121011",
              "Jupyter Notebook": "F37626"

          }


          lines = []

          # Header
          lines.append('<div align="center">')
          lines.append('')
          lines.append('### 🌟 Explore My Public Projects')
          lines.append('')
          lines.append('💡 *Automatically updated with my latest work*')
          lines.append('')
          lines.append('</div>')
          lines.append('')


          if not repos:

              lines.append(
                  '> 🚧 **New projects are coming soon. Stay tuned!**'
              )


          for index, repo in enumerate(repos, start=1):

              name = repo["name"]

              url = repo["html_url"]

              description = (
                  repo["description"]
                  or "A project built as part of my development journey."
              )

              language = (
                  repo["language"]
                  or "Code"
              )

              stars = repo["stargazers_count"]

              forks = repo["forks_count"]

              updated = repo["updated_at"][:10]


              # Clean markdown-breaking characters
              description = description.replace("|", "-")
              description = description.replace("\n", " ")
              description = description.replace("\r", " ")


              # Get language badge color
              color = language_colors.get(
                  language,
                  "6366F1"
              )


              # URL-safe language
              encoded_language = quote(language)


              lines.append('---')
              lines.append('')

              lines.append(
                  f'## 🚀 [{name}]({url})'
              )

              lines.append('')

              lines.append(
                  f'> {description}'
              )

              lines.append('')

              lines.append('<p>')

              # Language Badge
              lines.append(
                  f'<img src="https://img.shields.io/badge/'
                  f'{encoded_language}-{color}'
                  f'?style=for-the-badge'
                  f'&logoColor=white" />'
              )

              # Stars Badge
              lines.append(
                  f'<img src="https://img.shields.io/badge/'
                  f'Stars-{stars}-F5C518'
                  f'?style=for-the-badge'
                  f'&logo=github'
                  f'&logoColor=white" />'
              )

              # Fork Badge
              lines.append(
                  f'<img src="https://img.shields.io/badge/'
                  f'Forks-{forks}-6366F1'
                  f'?style=for-the-badge'
                  f'&logo=git'
                  f'&logoColor=white" />'
              )

              lines.append('</p>')

              lines.append('')

              lines.append(
                  f'[![View Repository]'
                  f'(https://img.shields.io/badge/'
                  f'VIEW%20SOURCE%20CODE-181717'
                  f'?style=for-the-badge'
                  f'&logo=github'
                  f'&logoColor=white)]'
                  f'({url})'
              )

              lines.append('')

              lines.append(
                  f'🕒 **Last updated:** `{updated}`'
              )

              lines.append('')


          repo_section = "\n".join(lines)


          readme_path = "README.md"


          with open(
              readme_path,
              "r",
              encoding="utf-8"
          ) as file:

              content = file.read()


          pattern = (
              r"<!-- REPO-LIST:START -->"
              r".*?"
              r"<!-- REPO-LIST:END -->"
          )


          replacement = (

              "<!-- REPO-LIST:START -->\n"

              + repo_section

              + "\n<!-- REPO-LIST:END -->"

          )


          updated_content = re.sub(

              pattern,

              replacement,

              content,

              flags=re.DOTALL

          )


          with open(
              readme_path,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(updated_content)


          print(
              f"✨ Successfully updated {len(repos)} repositories!"
          )

          PYTHON


      - name: 💾 Commit Changes

        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add README.md


          if git diff --cached --quiet; then

            echo "✨ Everything is already up to date!"

          else

            git commit -m "✨ Auto-update project showcase"

            git push

          fi
