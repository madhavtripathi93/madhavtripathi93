name: Update GitHub Projects

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Profile Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Repository Showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: madhavtripathi93
          PROFILE_REPO: madhavtripathi93

        run: |
          python << 'PYTHON'
          import os
          import re
          import json
          import urllib.request
          from urllib.parse import quote

          username = os.environ["USERNAME"]
          profile_repo = os.environ["PROFILE_REPO"]
          token = os.environ["GITHUB_TOKEN"]

          repos = []
          page = 1

          while True:
              api_url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?visibility=public"
                  f"&sort=updated"
                  f"&direction=desc"
                  f"&per_page=100"
                  f"&page={page}"
              )

              request = urllib.request.Request(
                  api_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1


          # Keep only active, original public repositories.
          repos = [
              repo for repo in repos
              if repo["name"].lower() != profile_repo.lower()
              and not repo["fork"]
              and not repo["archived"]
          ]


          lines = []


          if not repos:

              lines.append('<div align="center">')
              lines.append('')
              lines.append('*Projects will appear here automatically.*')
              lines.append('')
              lines.append('</div>')

          else:

              lines.append('<div align="center">')
              lines.append('')


              for index, repo in enumerate(repos):

                  name = repo["name"]
                  repo_url = repo["html_url"]

                  # URL-safe repository name
                  encoded_name = quote(name, safe="")


                  # GitHub README Stats pinned repository card
                  card_url = (
                      "https://github-readme-stats.vercel.app/api/pin/"
                      f"?username={username}"
                      f"&repo={encoded_name}"
                      "&theme=tokyonight"
                      "&hide_border=true"
                  )


                  lines.append(
                      f'<a href="{repo_url}">'
                  )

                  lines.append(
                      f'<img src="{card_url}" '
                      f'alt="{name}" />'
                  )

                  lines.append(
                      '</a>'
                  )


                  # Two cards per row
                  if index % 2 == 1:
                      lines.append('<br/>')
                      lines.append('')


              # If there is an odd number of repositories,
              # add spacing after the final card.
              if len(repos) % 2 == 1:
                  lines.append('')


              lines.append('</div>')


          repo_section = "\n".join(lines)


          readme_path = "README.md"


          with open(
              readme_path,
              "r",
              encoding="utf-8"
          ) as file:
              content = file.read()


          pattern = (
              r"<!-- REPO-LIST:START -->"
              r".*?"
              r"<!-- REPO-LIST:END -->"
          )


          replacement = (
              "<!-- REPO-LIST:START -->\n"
              + repo_section
              + "\n<!-- REPO-LIST:END -->"
          )


          updated_content = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL
          )


          if updated_content == content:
              print("README repository section is already up to date.")
          else:
              with open(
                  readme_path,
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(updated_content)

              print(
                  f"Successfully updated {len(repos)} repositories."
              )

          PYTHON


      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes detected."
          else
            git commit -m "chore: update project showcase"
            git push
          fi
